<script>
// VOID DIVER web log collector (WebGLBuild.AddLogCollector puts this first in <head>, before the Unity loader).
// Keeps the last lines of the browser console (Unity's Debug.Log and the game's [VD:...] diagnostics go there),
// uncaught errors, rejected promises, failed or slow network requests and a heartbeat in a ring buffer, saved to
// localStorage every 2 s and when the page is hidden. At start the previous visit's log moves to a second key, so
// after a hang and a reload both are there. F8 or the LOG tab on the right edge downloads voiddiver-log-<time>.txt
// and copies it to the clipboard. ?debug=1 also logs every network request.
// Upload (2026-11-03): the log also goes to the hub's Supabase table vd_logs (db/vd-logs.sql) so the developers read it
// without the player sending a file: every 15 s (new lines only), when the page is hidden or closed, when the game
// reports a hang ([VD:Hang] / [VD:Released]) and on F8. ?vdlog=0 turns the upload off.
(function () {
  var KEY = 'vd-log', PREV = 'vd-log-prev', MAX_LINES = 3000, MAX_LINE = 1500;
  var debug = /[?&]debug=1\b/.test(location.search);
  var started = new Date(), lines = [], dirty = false, frames = 0, inFlight = {}, nextReq = 0;
  try {
    var old = localStorage.getItem(KEY);
    if (old) localStorage.setItem(PREV, old);
    localStorage.removeItem(KEY);
  } catch (e) {}

  function stamp() { return new Date().toISOString().substr(11, 12); }
  function text(v) {
    if (typeof v === 'string') return v;
    if (v instanceof Error) return v.stack || String(v);
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }
  function add(level, msg) {
    var line = stamp() + ' ' + level + ' ' + msg;
    if (line.length > MAX_LINE) line = line.substr(0, MAX_LINE) + ' ...[cut]';
    lines.push(line);
    total++;
    if (lines.length > MAX_LINES) lines.splice(0, lines.length - MAX_LINES);
    dirty = true;
    if ((msg.indexOf('[VD:Hang]') >= 0 || msg.indexOf('[VD:Released]') >= 0) && Date.now() - lastHangUpload > 20000) {
      lastHangUpload = Date.now();
      setTimeout(function () { ship('hang', msg.substr(0, 300), true); }, 1500);
    }
  }
  function build() {
    var s = document.querySelector('script[src*=".loader.js"]');
    return s ? s.getAttribute('src').replace(/^.*\//, '').replace('.loader.js', '') : '?';
  }
  // full: the whole ring buffer (hang, F8); otherwise only the lines added since the last upload. keepalive requests
  // (page closing) are limited to 64 KB by the browser, so their text is cut to the newest 60000 characters.
  function ship(trigger, note, full, closing) {
    if (!upload || (uploading && !closing)) return Promise.resolve(false);
    var fresh = Math.min(total - sentTotal, lines.length);
    if (!full && fresh <= 0) return Promise.resolve(false);
    var part = full ? lines : lines.slice(lines.length - fresh), text = part.join('\n');
    if (closing && text.length > 60000) text = text.substr(text.length - 60000);
    var mark = total;
    var body = JSON.stringify({ session: session, build: build(), trigger: trigger, note: note || null, url: location.href,
      ua: navigator.userAgent, buffer: text });
    uploading = true;
    return origFetchRef(SB_URL, { method: 'POST', keepalive: !!closing, body: body, headers: { 'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' } })
      .then(function (r) { uploading = false; if (r.ok) { sentTotal = mark; return true; }
        console.warn('[vd-log] upload refused: HTTP ' + r.status); return false; },
        function (e) { uploading = false; console.warn('[vd-log] upload failed: ' + e); return false; });
  }
  window.vdShipLog = ship;
  window.vdLog = add;
  var SB_URL = 'https://jvdguaecnllejdmgytia.supabase.co/rest/v1/vd_logs';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2ZGd1YWVjbmxsZWpkbWd5dGlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDM3MTAsImV4cCI6MjEwMDgxOTcxMH0.oo1rodkh8_c7tBa-jptqHfemxmY9h8Q_r8DYrUYL9AI';
  var upload = !/[?&]vdlog=0\b/.test(location.search);
  var session = started.toISOString().replace(/[-:.TZ]/g, '').substr(0, 14) + '-' + Math.random().toString(36).substr(2, 6);
  var total = 0, sentTotal = 0, uploading = false, lastHangUpload = 0;

  ['log', 'info', 'warn', 'error', 'debug'].forEach(function (name) {
    var orig = console[name];
    console[name] = function () {
      try { add(name.toUpperCase(), Array.prototype.map.call(arguments, text).join(' ')); } catch (e) {}
      return orig.apply(console, arguments);
    };
  });

  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) { add('RESOURCE-FAIL', (t.tagName || '') + ' ' + (t.src || t.href)); return; }
    add('UNCAUGHT', (e.message || '') + ' at ' + (e.filename || '?') + ':' + (e.lineno || 0) + ':' + (e.colno || 0) +
      (e.error && e.error.stack ? '\n' + e.error.stack : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    add('UNHANDLED-REJECTION', r && r.stack ? r.stack : text(r));
  });

  // Network: Unity downloads bundles with fetch (or XHR). Failures and requests over 5 s are always logged, every
  // request with ?debug=1; the heartbeat lists the ones still open, which is what an endless load waits on.
  function short(url) { url = String(url); var q = url.indexOf('?'); if (q > 0) url = url.substr(0, q); return url.substr(url.lastIndexOf('/') + 1) || url; }
  function begin(url) { var id = ++nextReq; inFlight[id] = { url: short(url), t: Date.now() }; if (debug) add('NET', 'start ' + short(url)); return id; }
  function end(id, status, bytes) {
    var r = inFlight[id]; if (!r) return; delete inFlight[id];
    var ms = Date.now() - r.t, bad = !(status >= 200 && status < 400);
    if (bad || ms > 5000 || debug) add(bad ? 'NET-FAIL' : 'NET', r.url + ' -> ' + status + (bytes != null ? ', ' + bytes + ' bytes' : '') + ' in ' + ms + ' ms');
  }
  var origFetchRef = window.fetch ? window.fetch.bind(window) : function () { return Promise.reject('no fetch'); };
  if (window.fetch) {
    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      var id = begin(input && input.url ? input.url : input);
      return origFetch.apply(this, arguments).then(function (res) {
        end(id, res.status, res.headers.get('content-length'));
        return res;
      }, function (err) { end(id, 'error ' + (err && err.message), null); throw err; });
    };
  }
  var origOpen = XMLHttpRequest.prototype.open, origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) { this.__vdUrl = url; return origOpen.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function () {
    var xhr = this, id = begin(xhr.__vdUrl);
    xhr.addEventListener('loadend', function () {
      var size = null; try { size = xhr.response && xhr.response.byteLength; } catch (e) {}
      end(id, xhr.status || 'error', size);
    });
    return origSend.apply(this, arguments);
  };

  // Frames: Unity draws through requestAnimationFrame, so frames counted here say whether the game loop still runs.
  var origRaf = window.requestAnimationFrame;
  window.requestAnimationFrame = function (cb) { return origRaf.call(window, function (t) { frames++; cb(t); }); };
  var lastBeat = Date.now();
  setInterval(function () {
    var now = Date.now(), secs = (now - lastBeat) / 1000; lastBeat = now;
    var open = [];
    for (var k in inFlight) { var age = (now - inFlight[k].t) / 1000; if (age > 10) open.push(inFlight[k].url + ' ' + age.toFixed(0) + ' s'); }
    var mem = performance.memory ? ', JS heap ' + (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + ' MB' : '';
    add('BEAT', 'page up ' + ((now - started) / 1000).toFixed(0) + ' s, ' + (frames / secs).toFixed(0) + ' fps' + mem +
      (document.hidden ? ', tab hidden' : '') + (open.length ? ', requests open over 10 s: ' + open.join('; ') : ''));
    frames = 0;
  }, 15000);

  function flush() {
    if (!dirty) return;
    dirty = false;
    var data = JSON.stringify({ start: started.toISOString(), url: location.href, lines: lines });
    for (var i = 0; i < 3; i++) {
      try { localStorage.setItem(KEY, data); return; } catch (e) {
        lines.splice(0, Math.ceil(lines.length / 2));
        data = JSON.stringify({ start: started.toISOString(), url: location.href, lines: lines });
      }
    }
  }
  setInterval(flush, 2000);
  setInterval(function () { ship('timer'); }, 15000);
  window.addEventListener('pagehide', function () { flush(); ship('pagehide', null, false, true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { flush(); ship('hidden', null, false, true); } });

  function report() {
    flush();
    var out = ['VOID DIVER web log', 'exported ' + new Date().toISOString(), 'page ' + location.href,
      'browser ' + navigator.userAgent, 'screen ' + screen.width + 'x' + screen.height + ' @' + devicePixelRatio +
      ', window ' + innerWidth + 'x' + innerHeight + (navigator.deviceMemory ? ', device memory ' + navigator.deviceMemory + ' GB' : ''), ''];
    try {
      var prev = JSON.parse(localStorage.getItem(PREV) || 'null');
      if (prev) out.push('===== previous visit (started ' + prev.start + ') =====', prev.lines.join('\n'), '');
    } catch (e) { out.push('(previous visit log unreadable: ' + e + ')'); }
    out.push('===== this visit (started ' + started.toISOString() + ') =====', lines.join('\n'));
    return out.join('\n');
  }
  function save() {
    var body = report(), name = 'voiddiver-log-' + new Date().toISOString().replace(/[:.]/g, '-').substr(0, 19) + '.txt';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([body], { type: 'text/plain' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    var copied = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(body) : Promise.reject('no clipboard');
    copied.then(function () { toast('Log saved as ' + name + ' and copied to the clipboard'); },
      function () { toast('Log saved as ' + name); });
    add('LOG', 'exported ' + name + ', ' + body.length + ' chars');
    ship('F8', 'exported ' + name, true);
  }
  window.vdSaveLog = save;
  function toast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:100;background:#102a2a;color:#d8f3f0;' +
      'font:13px system-ui,sans-serif;padding:8px 14px;border:1px solid #46a4a0;border-radius:4px';
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 4000);
  }
  window.addEventListener('keydown', function (e) {
    if (e.key === 'F8') { e.preventDefault(); e.stopPropagation(); save(); }
  }, true);
  function button() {
    var b = document.createElement('div');
    b.id = 'vd-log-button'; b.textContent = 'LOG'; b.title = 'Save the game log (F8)';
    b.style.cssText = 'position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:50;cursor:pointer;' +
      'writing-mode:vertical-rl;padding:10px 4px;font:600 11px/1 system-ui,sans-serif;letter-spacing:.15em;' +
      'color:#cfe8e6;background:rgba(16,42,42,.55);border:1px solid rgba(70,164,160,.5);border-right:0;' +
      'border-radius:4px 0 0 4px;opacity:' + (debug ? '.9' : '.35');
    b.onmouseenter = function () { b.style.opacity = '1'; };
    b.onmouseleave = function () { b.style.opacity = debug ? '.9' : '.35'; };
    b.onclick = save;
    (document.getElementById('unity-container') || document.body).appendChild(b);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', button); else button();
  add('LOG', 'collector on, debug=' + debug + ', upload=' + upload + ', session ' + session + ', ' + navigator.userAgent);
})();
</script>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/vd-webgl-build-opt19.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/vd-webgl-build-opt19.data.unityweb?v=79d68313a930f0dc",
        frameworkUrl: buildUrl + "/vd-webgl-build-opt19.framework.js.unityweb?v=819a941e665df86a",
        codeUrl: buildUrl + "/vd-webgl-build-opt19.wasm.unityweb?v=c018a7bcdb2b25e1",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Nemo Studio",
        productName: "VOID DIVER",
        productVersion: "0.0.0.135",
        // VOID DIVER return-visit cache (WebGLBuild.AddCacheControl puts this in the loader config and fills
        // vdCacheIds). The Unity loader keeps every file whose cacheControl answer is "immutable" or "must-revalidate"
        // in IndexedDB (UnityCache, up to 1 GB), keyed by URL; the engine files (.data, .wasm, .framework.js) and every
        // UnityWebRequest (Addressables bundles and catalog, the StreamingAssets pack) go through it.
        // "must-revalidate" is not enough on GitHub Pages: its replicas hold the same file with Last-Modified one second
        // apart, so a revalidation that reaches the other replica gets the whole file again (200 instead of 304), and the
        // template answered "no-store" for everything but the .data file and the bundles anyway. So every file is asked
        // for by a URL that names its content, and kept "immutable" (never asked for again):
        //   - Addressables bundles: their names already end with a hash of their content.
        //   - Files with fixed names: the build hashes each one into vdCacheIds; the engine files carry it in their
        //     URLs below (?v=<id>), UnityWebRequest URLs get it from the preRun wrapper around Module.cachedFetch.
        //   - Other same-site files: "must-revalidate". Anything on another site (the log upload): not cached.
        // A new build changes the ids of the files it changed; the old copies age out of UnityCache's 1 GB.
        vdCacheIds: {
          "StreamingAssets/aa/AddressablesLink/link.xml": "8258f280088d3457",
          "StreamingAssets/aa/catalog.bin": "86a4d3b9d3261de3",
          "StreamingAssets/aa/catalog.hash": "fe42d5312d847b0f",
          "StreamingAssets/aa/settings.json": "f9eccd27062b8a4f",
          "StreamingAssets/vd-streaming-files.txt": "475c3f8f6f264149",
          "StreamingAssets/vd-streaming-pack.txt": "7ff59bb26513fedd"
        },
        cacheControl: function (url) {
          var u = new URL(url, location.href);
          if (u.origin !== location.origin) return "no-store";
          if (/[?&]v=[0-9a-f]{16}$/.test(u.search)) return "immutable";
          if (/_[0-9a-f]{32}\.bundle(\.txt)?$/.test(u.pathname)) return "immutable";
          var root = new URL(".", location.href).pathname;
          var ids = (this && this.vdCacheIds) || {};
          if (u.pathname.lastIndexOf(root, 0) === 0 && ids[u.pathname.substr(root.length)]) return "immutable";
          return "must-revalidate";
        },
        preRun: [function (Module) {
          var cachedFetch = Module.cachedFetch, ids = Module.vdCacheIds, root = new URL(".", location.href);
          if (!cachedFetch) return;
          Module.cachedFetch = function (url, init) {
            var u = new URL(typeof url === "string" ? url : url.url, location.href);
            var id = u.origin === location.origin && !u.search && u.pathname.lastIndexOf(root.pathname, 0) === 0 ? ids[u.pathname.substr(root.pathname.length)] : null;
            return cachedFetch(id ? u.href + "?v=" + id : url, init);
          };
        }],
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>

<script>
(function () {
  var el = document.getElementById('vd-loading'), fill = el.querySelector('.fill'), status = el.querySelector('.status');
  var expected = 370316725, bytes = 0, done = false, last = 0, lastChange = Date.now();
  try {
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (e) { bytes += e.encodedBodySize || e.transferSize || 0; });
    }).observe({ type: 'resource', buffered: true });
  } catch (e) {}
  function place() {
    var c = document.getElementById('unity-canvas');
    if (c) { var r = c.getBoundingClientRect(); el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
      el.style.width = r.width + 'px'; el.style.height = r.height + 'px'; }
  }
  function tick() {
    if (done) return;
    place();
    if (bytes !== last) { last = bytes; lastChange = Date.now(); }
    var mb = (bytes / 1048576).toFixed(0), idle = Date.now() - lastChange > 2500;
    fill.style.width = Math.min(97, 100 * bytes / expected).toFixed(1) + '%';
    status.textContent = idle && bytes > 0 ? 'Preparing the game... (' + mb + ' MB loaded)' : 'Downloading game data... ' + mb + ' MB';
    requestAnimationFrame(tick);
  }
  window.vdLoadingDone = function () {
    if (done) return;
    done = true; fill.style.width = '100%'; el.style.opacity = '0';
    console.log('[vd-loading] title after ' + (performance.now() / 1000).toFixed(1) + ' s, ' + (bytes / 1048576).toFixed(0) + ' MB loaded');
    setTimeout(function () { el.remove(); }, 700);
    var c = document.getElementById('unity-canvas'); if (c) c.focus();
  };
  tick();
})();
// The game fills the window at 16:9, as on a monitor, instead of the template's fixed 960x600 box: leaving
// fullscreen (Esc) used to drop it into that small box. In fullscreen, Esc is locked to the page where the browser
// allows it (Chrome), so a press reaches the game's menu and holding it leaves fullscreen.
(function () {
  var canvas = document.getElementById('unity-canvas');
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    if (w * 9 > h * 16) w = Math.round(h * 16 / 9); else h = Math.round(w * 9 / 16);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', function () {
    fit();
    if (document.fullscreenElement && navigator.keyboard && navigator.keyboard.lock)
      navigator.keyboard.lock(['Escape']).catch(function () {});
  });
  var button = document.createElement('div');
  button.id = 'vd-fullscreen'; button.title = 'Fullscreen';
  button.onclick = function () { (document.getElementById('unity-container') || canvas).requestFullscreen().catch(function () {}); };
  document.body.appendChild(button);
})();
</script>
